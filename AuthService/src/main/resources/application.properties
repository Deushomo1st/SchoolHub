spring.application.name=AuthService
server.port=9001

# active-db.properties (project root) is the single point of reference for which
# database to use, managed by setup/SchoolHub-Manager.ps1. Two-path import so
# both the launcher (module subdir) and IntelliJ (varies by run config) find it.
# Falls back to SCHOOLHUB_DB_NAME env var, then "schoolhub".
spring.config.import=optional:file:./active-db.properties,optional:file:../active-db.properties

# Force UTF-8 on all responses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Database - one DB, AuthService binds to the shared platform schema
spring.datasource.url=jdbc:postgresql://localhost:5432/${schoolhub.db.name:${SCHOOLHUB_DB_NAME:schoolhub}}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=platform

# JWT - shared secret across all SchoolHub services.
# The launcher injects a random SCHOOLHUB_JWT_SECRET; the default below is a
# DEV-ONLY fallback so the services run from an IDE with no env var set.
# All services share the same value so tokens verify across them.
security.jwt.secret=${SCHOOLHUB_JWT_SECRET:schoolhub-local-dev-secret-change-me-please-0123456789}
security.jwt.access-expiry-minutes=60
security.jwt.refresh-expiry-days=7
security.jwt.issuer=schoolhub-auth

# Hikari pool cap (many services share one Postgres)
spring.datasource.hikari.maximum-pool-size=3

# Forgot-password email. SMTP via env (SMTP_HOST etc.); without SMTP_HOST the reset
# link is logged to this console instead (dev fallback).
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
schoolhub.app-base-url=${STRIPE_APP_BASE_URL:http://localhost:9000}
schoolhub.mail-from=${SMTP_FROM:no-reply@schoolhub.local}
