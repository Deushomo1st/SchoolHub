<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolHub - reset password</title>
  <link rel="stylesheet" href="/css/style.css?v=52">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('shTheme')||'light'}catch(e){}</script>
</head>
<body class="landing">
  <div class="hero">
    <h1>Reset your password</h1>
    <p class="hero-role">One-shot link · expires 30 minutes after it was requested</p>
  </div>
  <div class="left-accent"></div>

  <div class="container narrow">
    <div class="card login-card">
      <div id="msg" class="msg"></div>
      <form id="resetForm">
        <label>New password (min 8)</label>
        <input name="newPassword" type="password" minlength="8" autocomplete="new-password" required>
        <label>Confirm new password</label>
        <input name="confirm" type="password" minlength="8" autocomplete="new-password" required>
        <div style="margin-top:18px">
          <button class="btn" type="submit">Set new password</button>
        </div>
      </form>
      <p class="muted" style="margin-top:18px"><a href="/login.html">Back to log in</a></p>
    </div>
  </div>

  <script src="/js/app.js?v=29"></script>
  <script>
    const msg = document.getElementById('msg');
    const token = new URLSearchParams(location.search).get('token');
    if (!token) showMsg(msg, 'This page needs the reset link from your email.', 'err');

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault(); hideMsg(msg);
      const b = Object.fromEntries(new FormData(e.target));
      if (b.newPassword !== b.confirm) { showMsg(msg, 'The two passwords do not match.', 'err'); return; }
      try {
        const r = await api('/api/v1/auth/reset-password', { method: 'POST', body: JSON.stringify({ token: token, newPassword: b.newPassword }) });
        showMsg(msg, r.message + ' Redirecting…', 'ok');
        setTimeout(() => location.replace('/login.html'), 1800);
      } catch (err) { showMsg(msg, err.message, 'err'); }
    });
  </script>
</body>
</html>
