<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dot-Matrix Graph</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;height:100vh;overflow:hidden;font-family:monospace}
canvas{display:block;filter:drop-shadow(0 0 3px rgba(255,255,255,.35))}
#graph-area{flex:1;position:relative}
#sidebar{width:90px;background:#0a0a0a;border-left:1px solid #1a1a1a;display:flex;flex-direction:column;padding:12px 6px;gap:2px;user-select:none}
#sidebar .label{color:#444;font-size:10px;text-align:center;margin-bottom:6px;letter-spacing:2px}
.ts-btn{background:transparent;border:1px solid #1a1a1a;color:#555;padding:6px 4px;font-size:10px;cursor:pointer;border-radius:3px;text-align:center;transition:all .15s;font-family:inherit}
.ts-btn:hover{border-color:#333;color:#999}
.ts-btn.active{background:#1a1a1a;color:#fff;border-color:#444}
</style>
</head>
<body>
<div id="graph-area"><canvas id="c"></canvas></div>
<div id="sidebar"><div class="label">TIMEFRAME</div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),A=document.getElementById('graph-area'),S=document.getElementById('sidebar')
const TS=[{id:'1s',l:'1s',hz:3,sp:0.08,amp:0.9,w:6},{id:'1m',l:'1m',hz:1.5,sp:0.05,amp:0.8,w:10},{id:'5m',l:'5m',hz:0.8,sp:0.03,amp:0.7,w:14},{id:'1h',l:'1h',hz:0.3,sp:0.015,amp:0.6,w:20},{id:'4h',l:'4h',hz:0.12,sp:0.008,amp:0.5,w:28},{id:'1D',l:'1D',hz:0.04,sp:0.003,amp:0.4,w:40},{id:'1W',l:'1W',hz:0.015,sp:0.001,amp:0.3,w:55},{id:'1M',l:'1M',hz:0.004,sp:0.0004,amp:0.25,w:75},{id:'1Y',l:'1Y',hz:0.0008,sp:0.00008,amp:0.18,w:100}]
let cs=TS[0],pks=[],t=0,G=5
TS.forEach(ts=>{const b=document.createElement('button');b.className='ts-btn'+(ts===cs?' active':'');b.textContent=ts.l;b.onclick=()=>{document.querySelectorAll('.ts-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');cs=ts;pks=[]};S.appendChild(b)})
function R(){const r=A.getBoundingClientRect();C.width=r.width*devicePixelRatio;C.height=r.height*devicePixelRatio;C.style.width=r.width+'px';C.style.height=r.height+'px';X.scale(devicePixelRatio,devicePixelRatio)}
window.addEventListener('resize',R);R()
function Gs(x,c,w){return Math.exp(-((x-c)**2)/(2*w*w))}
function V(x,w){let v=Math.sin(x*.02+t*cs.hz)*.35+Math.sin(x*.007+t*cs.hz*.6)*.25+Math.sin(x*.05+t*cs.hz*1.3)*.1;for(const p of pks)v+=p.amp*Gs(x,p.c,p.w)*p.life;return v}
function Sp(w){if(Math.random()<cs.sp)pks.push({c:Math.random()*w,amp:cs.amp*(.4+Math.random()*.6),w:cs.w*(.5+Math.random()*.8),life:1,decay:.002+Math.random()*.006});for(let i=pks.length-1;i>=0;i--){pks[i].life-=pks[i].decay;if(pks[i].life<=0)pks.splice(i,1)}}
function D(){const w=A.getBoundingClientRect().width,h=A.getBoundingClientRect().height;R();X.clearRect(0,0,w,h);Sp(w);const my=h/2,cols=Math.floor(w/G),vals=new Float32Array(cols);for(let i=0;i<cols;i++)vals[i]=V(i*G,w);X.fillStyle='#fff';for(let cx=0;cx<cols;cx++){const wy=my-vals[cx]*my*.85,dr=Math.floor(wy/G);for(let ry=0;ry<dr;ry++){const y=ry*G;if((cx+ry)%2===0)X.fillRect(cx*G,y,1.5,1.5)}}t++;requestAnimationFrame(D)}
D()
</script>
</body>
</html>
