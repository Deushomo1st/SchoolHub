<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lava Hub</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c14;min-height:100vh;font-family:system-ui,sans-serif}
#lavaNav{position:fixed;top:120px;right:24px;z-index:9999;width:56px;height:56px;display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none}
#lavaNav:active{cursor:grabbing}
.rainbow-halo{position:absolute;z-index:1;width:66px;height:66px;border-radius:50%;left:-5px;top:-5px;padding:5px;background:conic-gradient(#ff0040,#ff00c8,#7300ff,#00ccff,#00ff88,#ffea00,#ff0040);animation:haloSpin var(--ring-speed,4s) linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:blur(.5px)}
.rainbow-halo::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:repeating-conic-gradient(rgba(0,0,0,.7) 0deg 5deg,transparent 5deg 12deg,rgba(255,255,255,.5) 12deg 15deg,transparent 15deg 25deg,rgba(0,0,0,.6) 25deg 30deg,transparent 30deg 45deg,rgba(255,255,255,.4) 45deg 48deg,transparent 48deg 60deg,rgba(0,0,0,.5) 60deg 65deg,transparent 65deg 80deg,rgba(255,255,255,.5) 80deg 83deg,transparent 83deg 100deg);animation:squirmSpin 2.7s linear infinite;pointer-events:none}
@keyframes haloSpin{to{transform:rotate(360deg)}}
@keyframes squirmSpin{to{transform:rotate(-360deg)}}
.lava-core{position:relative;z-index:3;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 35% 35%,#6b6b6b,#2a2a2a 60%,#111);box-shadow:inset 0 2px 3px rgba(255,255,255,.15),inset 0 -2px 4px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.5);display:grid;place-items:center;transition:transform .2s}
.lava-core:hover{transform:scale(1.05);box-shadow:inset 0 3px 5px rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.7),0 0 16px rgba(255,255,255,.1),0 6px 18px rgba(0,0,0,.6)}
.lava-core svg{width:24px;height:24px;fill:none;stroke:rgba(255,255,255,.6);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lava-core::before{content:"";position:absolute;width:85%;height:85%;border-radius:50%;background:radial-gradient(circle at 25% 20%,rgba(255,255,255,.1),transparent 50%);filter:blur(3px);pointer-events:none}
.lava-sats{position:absolute;inset:-40px;pointer-events:none}
.moon{position:absolute;left:50%;top:50%;opacity:0;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--angle,-90deg)) translateY(calc(var(--dist,0px)*-1)) scale(.3);transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .25s .1s;width:38px;height:38px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:linear-gradient(180deg,#4a4a4a,#333 15%,#252525 50%,#1a1a1a 90%,#111);color:transparent;font-size:0;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 2px rgba(255,255,255,.08),inset 0 -2px 4px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.4);font-family:inherit;overflow:hidden;display:flex;align-items:center;justify-content:center}
.moon::before{content:"";position:absolute;inset:-16px;border-radius:50%;pointer-events:auto}
.moon svg{flex-shrink:0;width:18px;height:18px;fill:none;stroke:rgba(255,255,255,.6);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#lavaNav:hover .moon,.lava-sats:hover .moon{--dist:80px;opacity:1;pointer-events:auto;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(80px*-1)) scale(1);transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .15s}
.moon:nth-child(1){transition-delay:0s,0s}
.moon:nth-child(2){transition-delay:.04s,.04s}
.moon:nth-child(3){transition-delay:.08s,.08s}
#lavaNav:not(:hover) .moon:not(:hover),.lava-sats:not(:hover) .moon:not(:hover){--dist:0px;opacity:0;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(0) scale(.3);transition-delay:0s,.25s}
.moon:hover{width:auto;height:auto;min-width:38px;border-radius:999px;padding:8px 16px;color:rgba(255,255,255,.7);font-size:12px;gap:8px;background:linear-gradient(180deg,#555,#3a3a3a 20%,#2a2a2a 60%,#1a1a1a 90%,#111);border-color:rgba(255,255,255,.3)}
.moon:hover svg{width:16px;height:16px}
.moon::after{content:attr(data-label);opacity:0;transition:opacity .2s}
.moon:hover::after{opacity:1}
</style></head><body><div id="lavaNav"><div class="rainbow-halo"></div><div class="lava-core"><svg viewBox="0 0 24 24"><polygon points="12 2 3 7 3 17 12 22 21 17 21 7"/><circle cx="12" cy="12" r="4"/></svg></div><div class="lava-sats"><button class="moon moon-return" data-label="Return"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button><button class="moon moon-home" data-label="Home"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></button><button class="moon moon-report" data-label="Report"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></button></div></div>
<script>
(function(){var nav=document.getElementById("lavaNav"),sats=document.querySelectorAll(".moon"),dragging=!1,startX,startY,origLeft,origTop,deadzone=5;function adjustAngles(){var r=nav.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,scx=window.innerWidth/2,scy=window.innerHeight/2,tx=scx-cx,ty=scy-cy,base=Math.atan2(ty,tx)*180/Math.PI,dist=80,ang=[base-25,base,base+25],minGap=40;for(var p=0;p<3;p++)for(var i=0;i<3;i++)for(var j=i+1;j<3;j++){var d=ang[i]-ang[j];if(Math.abs(d)<minGap){var push=(minGap-Math.abs(d))/2;d>0?(ang[i]+=push,ang[j]-=push):(ang[i]-=push,ang[j]+=push)}}for(var k=0;k<3;k++){var ax=cx+dist*Math.cos(ang[k]*Math.PI/180),ay=cy+dist*Math.sin(ang[k]*Math.PI/180);ax<60&&(ang[k]+=10);ax>window.innerWidth-60&&(ang[k]-=10);ay<60&&(ang[k]+=10);ay>window.innerHeight-60&&(ang[k]-=10)}sats.forEach(function(s,i){s.style.setProperty("--angle",ang[i]+"deg");s.style.setProperty("--dist",dist+"px")})}adjustAngles();window.addEventListener("resize",adjustAngles);function cycleSpeed(){var h=nav.querySelector(".rainbow-halo");if(!h)return;h.style.setProperty("--ring-speed",["2s","2.5s","3s","3.5s","4.5s","5s","6s"][Math.floor(Math.random()*7)]);window._cycleTimer=setTimeout(cycleSpeed,2000+Math.random()*4000)}cycleSpeed();document.addEventListener("visibilitychange",function(){document.hidden?clearTimeout(window._cycleTimer):cycleSpeed()});nav.addEventListener("mousedown",function(e){if(e.target.closest(".moon"))return;dragging=!0;startX=e.clientX;startY=e.clientY;var r=nav.getBoundingClientRect();origLeft=r.left;origTop=r.top;nav.style.transition="none";e.preventDefault()});document.addEventListener("mousemove",function(e){if(!dragging)return;var dx=e.clientX-startX,dy=e.clientY-startY;nav.style.left=(origLeft+dx)+"px";nav.style.top=(origTop+dy)+"px";nav.style.right="auto";nav.style.bottom="auto";adjustAngles()});document.addEventListener("mouseup",function(){if(!dragging)return;var r=nav.getBoundingClientRect(),dist=Math.sqrt(Math.pow(r.left-origLeft,2)+Math.pow(r.top-origTop,2));nav.style.transition="";dist>deadzone&&adjustAngles();dragging=!1});nav.addEventListener("touchstart",function(e){if(e.target.closest(".moon"))return;dragging=!0;startX=e.touches[0].clientX;startY=e.touches[0].clientY;var r=nav.getBoundingClientRect();origLeft=r.left;origTop=r.top;nav.style.transition="none"},{passive:!1});document.addEventListener("touchmove",function(e){if(!dragging)return;var dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;nav.style.left=(origLeft+dx)+"px";nav.style.top=(origTop+dy)+"px";nav.style.right="auto";nav.style.bottom="auto";adjustAngles()},{passive:!1});document.addEventListener("touchend",function(){if(!dragging)return;var r=nav.getBoundingClientRect(),dist=Math.sqrt(Math.pow(r.left-origLeft,2)+Math.pow(r.top-origTop,2));nav.style.transition="";dist>deadzone&&adjustAngles();dragging=!1});document.querySelector(".moon-return").addEventListener("click",function(e){e.stopPropagation();history.back()});document.querySelector(".moon-home").addEventListener("click",function(e){e.stopPropagation();location.href="/app.html"});document.querySelector(".moon-report").addEventListener("click",function(e){e.stopPropagation();alert("Reports")})})();
</script></body></html>
