spring.application.name=TenantService
server.port=9002

# active-db.properties (project root) — two-path import for launcher + IDE.
spring.config.import=optional:file:./active-db.properties,optional:file:../active-db.properties

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# TenantService writes the registry (platform schema) AND provisions per-school schemas.
spring.datasource.url=jdbc:postgresql://localhost:5432/${schoolhub.db.name:${SCHOOLHUB_DB_NAME:schoolhub}}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=platform

# DEV-ONLY fallback secret (launcher injects a random one); shared across services.
security.jwt.secret=${SCHOOLHUB_JWT_SECRET:schoolhub-local-dev-secret-change-me-please-0123456789}
security.jwt.issuer=schoolhub-auth

spring.datasource.hikari.maximum-pool-size=3
