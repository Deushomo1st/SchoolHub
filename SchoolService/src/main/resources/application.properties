spring.application.name=SchoolService
server.port=9003

# active-db.properties (project root) — two-path import for launcher + IDE.
spring.config.import=optional:file:./active-db.properties,optional:file:../active-db.properties

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=jdbc:postgresql://localhost:5432/${schoolhub.db.name:${SCHOOLHUB_DB_NAME:schoolhub}}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Multi-tenant (schema-per-school): no single schema to validate against, and the
# per-tenant tables are created dynamically at signup. Hibernate routes each query
# to the JWT's tenant_schema via the MultiTenantConnectionProvider.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# DEV-ONLY fallback secret (launcher injects a random one); shared across services.
security.jwt.secret=${SCHOOLHUB_JWT_SECRET:schoolhub-local-dev-secret-change-me-please-0123456789}
security.jwt.issuer=schoolhub-auth

# Stripe (test mode) — keys live in .schoolhub_secrets.txt / env, never in source.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# Where hosted pages send the user back to.
stripe.app-base-url=${STRIPE_APP_BASE_URL:http://localhost:9000}

spring.datasource.hikari.maximum-pool-size=3
